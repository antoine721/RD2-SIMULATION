<title>Valentine, 1899</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Plan d'arpenteur vu de haut à gauche, registre du shérif à droite. */
:root {
  --papier: #e3e1cd;
  --fond: #d6d3bd;
  --panneau: #efede0;
  --encre: #29261f;
  --encre-douce: #5f5b4b;
  --trait: #9d9882;
  --boue: #cbbf9e;
  --bati: #d0cab0;
  --eau: #4a7c96;
  --accent: #1f5a7a;
  --sur-accent: #f4f2e8;
  --loi: #2c5f8f;
  --horsla: #a3352b;
  --commerce: #9a6d12;
  --animal: #5f6b2e;
  --objet: #6d5a45;
  --danger: #b23a2e;
  --bien: #3b7443;
  --nuit: #0f1b2b;
  --bulle: #fbfaf3;
  --brume: #f2f1ea;
  --chaleur: #e8a33c;
  --f-titre: "Rye", "Georgia", serif;
  --f-texte: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --f-registre: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #22241e; --fond: #191a16; --panneau: #20211b; --encre: #e7e3cf; --encre-douce: #aaa68f;
    --trait: #57564a; --boue: #3a3528; --bati: #2e2f28; --eau: #6a9fbd; --accent: #86bddd; --sur-accent: #10202b;
    --loi: #7fa9d6; --horsla: #e07a6c; --commerce: #d6a64a; --animal: #a7b36b; --objet: #b59d82;
    --danger: #e06a5c; --bien: #7cbf84; --nuit: #000000; --bulle: #2b2c25; --brume: #9a9a90; --chaleur: #c9852c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #22241e; --fond: #191a16; --panneau: #20211b; --encre: #e7e3cf; --encre-douce: #aaa68f;
  --trait: #57564a; --boue: #3a3528; --bati: #2e2f28; --eau: #6a9fbd; --accent: #86bddd; --sur-accent: #10202b;
  --loi: #7fa9d6; --horsla: #e07a6c; --commerce: #d6a64a; --animal: #a7b36b; --objet: #b59d82;
  --danger: #e06a5c; --bien: #7cbf84; --nuit: #000000; --bulle: #2b2c25; --brume: #9a9a90; --chaleur: #c9852c;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font-family: var(--f-texte); font-size: 15px; line-height: 1.4;
}
.appli { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* Bandeau */
.bandeau {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  padding: 10px 16px; border-bottom: 1px solid var(--trait); background: var(--panneau);
}
.bandeau h1 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: 26px; letter-spacing: .02em; line-height: 1; }
.bandeau h1 small { font-family: var(--f-registre); font-size: 13px; color: var(--encre-douce); margin-left: 6px; letter-spacing: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat dt { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--encre-douce); }
.stat dd { margin: 0; font-family: var(--f-registre); font-weight: 700; font-variant-numeric: tabular-nums; }
.stat dd.mauvais { color: var(--danger); }
.stat dd.bon { color: var(--bien); }
.horloge { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.horloge output { font-family: var(--f-registre); font-weight: 700; min-width: 4.2em; font-variant-numeric: tabular-nums; }
.horloge input[type=range] { width: 140px; accent-color: var(--accent); }
button {
  font: inherit; font-weight: 600; color: var(--encre); background: transparent;
  border: 1px solid var(--trait); border-radius: 3px; padding: 4px 10px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--encre); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.plein { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }

/* Corps : carte + registre */
.corps { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.carte-cadre { position: relative; min-height: 0; overflow: hidden; background: var(--papier); }
#carte { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#carte.glisse { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { background: var(--panneau); width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1; }
.legende-carte {
  position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px;
  background: var(--panneau); border: 1px solid var(--trait); padding: 6px 10px; font-size: 12px; max-width: calc(100% - 80px);
}
.legende-carte span { display: inline-flex; align-items: center; gap: 5px; }
.legende-carte i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid currentColor; }

/* SVG */
.grille line { stroke: var(--trait); stroke-width: .5; opacity: .35; }
.zone-rue { fill: var(--boue); }
.zone-rue-bord { fill: none; stroke: var(--trait); stroke-dasharray: 6 5; }
.zone-eau { fill: var(--eau); opacity: .28; }
.vague { fill: none; stroke: var(--eau); stroke-width: 1.5; opacity: .8; }
.rail { stroke: var(--encre); stroke-width: 2; }
.traverse { stroke: var(--encre-douce); stroke-width: 3; }
.enclos-cloture { fill: none; stroke: var(--objet); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
.croix { stroke: var(--encre-douce); stroke-width: 1.4; }
.nom-zone { font-family: var(--f-registre); font-size: 13px; fill: var(--encre-douce); letter-spacing: .12em; text-transform: uppercase; }
.batiment rect.mur { fill: var(--bati); stroke: var(--encre); stroke-width: 2; }
.batiment rect.hachure { fill: url(#hachures); pointer-events: none; }
.batiment text { font-family: var(--f-texte); font-weight: 700; font-size: 14px; fill: var(--encre); letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
.batiment { cursor: pointer; }
.batiment:hover rect.mur { stroke: var(--accent); }
.batiment.choisi rect.mur { stroke: var(--accent); stroke-width: 4; }
.batiment.detruit rect.mur { stroke-dasharray: 8 6; opacity: .55; }
.nuit-voile { fill: var(--nuit); pointer-events: none; transition: opacity .8s; }

.ent { cursor: pointer; transition: transform .9s ease-in-out, opacity .6s; }
.ent .forme { stroke-width: 2; }
.ent.habitant .forme { fill: var(--papier); stroke: var(--encre); }
.ent.habitant.loi .forme { stroke: var(--loi); fill: color-mix(in srgb, var(--loi) 22%, var(--papier)); }
.ent.habitant.hors_la_loi .forme { stroke: var(--horsla); fill: color-mix(in srgb, var(--horsla) 22%, var(--papier)); }
.ent.habitant.commerce .forme { stroke: var(--commerce); fill: color-mix(in srgb, var(--commerce) 22%, var(--papier)); }
.ent.animal .forme { fill: color-mix(in srgb, var(--animal) 35%, var(--papier)); stroke: var(--animal); }
.ent.objet .forme { fill: var(--papier); stroke: var(--objet); }
.ent text { font-family: var(--f-texte); font-size: 13px; font-weight: 600; fill: var(--encre); text-anchor: middle; paint-order: stroke; stroke: var(--papier); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.ent.animal text, .ent.objet text { font-weight: 500; font-size: 12px; fill: var(--encre-douce); }
.ent:hover .forme { stroke-width: 3; }
.ent .anneau { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.ent.choisi .anneau { opacity: 1; }
.ent .marque { stroke: var(--danger); stroke-width: 2.4; opacity: 0; }
.ent.mort .forme { fill: var(--trait); stroke: var(--encre-douce); }
.ent.mort .marque.croix-mort { opacity: 1; stroke: var(--encre); }
.ent.blesse .forme { stroke: var(--danger); stroke-dasharray: 3 2; }
.ent.hostile .forme { stroke: var(--danger); stroke-width: 3; }
.ent.ligote .forme { stroke-dasharray: 2 3; stroke: var(--objet); }
.ent.detruit .marque.croix-mort { opacity: 1; }
.ent.en_fuite { opacity: 0; pointer-events: none; }
.bulle rect { fill: var(--bulle); stroke: var(--encre); stroke-width: 1.2; }
.bulle path { fill: var(--bulle); stroke: var(--encre); stroke-width: 1.2; }
.bulle text { font-family: var(--f-texte); font-size: 13px; fill: var(--encre); font-style: italic; }
.bulle { pointer-events: none; opacity: 0; transition: opacity .35s; }
.bulle.visible { opacity: 1; }

/* Registre */
.registre { min-height: 0; overflow-y: auto; background: var(--panneau); border-left: 1px solid var(--trait); padding-block: 16px 28px; padding-inline: 18px; display: flex; flex-direction: column; gap: 18px; }
.registre h2 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.registre h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--encre-douce); font-weight: 700; }
.registre p { margin: 0; }
.fiche { display: flex; flex-direction: column; gap: 10px; }
.pastilles { display: flex; flex-wrap: wrap; gap: 6px; }
.pastille { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 2px; padding: 1px 6px; color: var(--encre-douce); }
.pastille.etat-mort, .pastille.etat-hostile, .pastille.etat-detruit, .pastille.etat-blesse { color: var(--danger); }
.pastille.rel-pos { color: var(--bien); }
.pastille.rel-neg { color: var(--danger); }
.ou { font-family: var(--f-registre); font-size: 13px; color: var(--encre-douce); }
.desc { font-size: 16px; }
.perso { color: var(--encre-douce); }
.categorie-actions { border-top: 1px solid var(--trait); padding-top: 8px; }
.categorie-actions summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--encre-douce); list-style-position: outside; }
.categorie-actions ul { list-style: none; margin: 8px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.action-ligne { display: flex; gap: 6px; min-width: 0; }
.action-ligne select { flex: 1; min-width: 0; font: inherit; color: var(--encre); background: var(--papier); border: 1px solid var(--trait); border-radius: 3px; padding: 3px 4px; }
.action { text-align: left; font-weight: 500; flex: 1; min-width: 0; background: var(--papier); }
.action-ligne .faire { flex: none; }
.raison { font-size: 12px; color: var(--encre-douce); align-self: center; white-space: nowrap; }
.reponse { background: var(--papier); border: 1px solid var(--trait); border-left: 4px solid var(--accent); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.reponse .quoi { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--encre-douce); font-weight: 700; }
.reponse .texte { font-size: 16px; }
.effets { display: flex; flex-wrap: wrap; gap: 4px; }
.effet { font-family: var(--f-registre); font-size: 12px; border: 1px solid var(--trait); padding: 0 5px; border-radius: 2px; }
.effet.plus { color: var(--bien); border-color: currentColor; }
.effet.moins { color: var(--danger); border-color: currentColor; }
.journal { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: var(--f-registre); font-size: 13px; }
.journal li { border-bottom: 1px dotted var(--trait); padding-bottom: 6px; }
.journal b { font-weight: 700; }
.journal .h { color: var(--encre-douce); margin-right: 6px; }
.index-ville { display: flex; flex-direction: column; gap: 10px; }
.index-ville ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.index-ville button { font-weight: 500; font-size: 14px; padding: 2px 8px; background: var(--papier); }
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chiffres div { border: 1px solid var(--trait); padding: 6px 8px; background: var(--papier); }
.chiffres b { display: block; font-family: var(--f-registre); font-size: 20px; font-variant-numeric: tabular-nums; }
.chiffres span { font-size: 12px; color: var(--encre-douce); text-transform: uppercase; letter-spacing: .06em; }
.retour { align-self: flex-start; }

@media (max-width: 900px) {
  .corps { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
  .appli { height: auto; min-height: 100%; }
  .registre { border-left: 0; border-top: 1px solid var(--trait); overflow: visible; }
  .horloge { margin-left: 0; }
  .horloge input[type=range] { width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  .ent, .bulle, .nuit-voile { transition: none; }
}

/* Monde : météo, joueur, événements */
.pluie-voile line { stroke: var(--eau); stroke-width: 1.2; opacity: .55; }
.brume-voile { fill: var(--brume); pointer-events: none; transition: opacity 1.2s; }
.chaleur-voile { fill: var(--chaleur); pointer-events: none; transition: opacity 1.2s; }
.eclair { fill: #ffffff; pointer-events: none; opacity: 0; }
.eclair.flash { animation: eclair .6s ease-out; }
@keyframes eclair { 0% { opacity: .55 } 15% { opacity: 0 } 25% { opacity: .35 } 100% { opacity: 0 } }
.ent.joueur .forme { fill: var(--accent); stroke: var(--encre); stroke-width: 2.5; }
.ent.joueur text { font-weight: 700; fill: var(--accent); }
.ent .alerte { fill: none; stroke: var(--commerce); stroke-width: 3; opacity: 0; }
.ent.agite .alerte, .batiment.agite rect.mur { animation: alerte 1.2s ease-in-out 5; }
@keyframes alerte { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
.batiment.agite rect.mur { stroke: var(--commerce); stroke-width: 4; }
.monde { font-family: var(--f-registre); font-size: 13px; color: var(--encre-douce); }
.monde b { color: var(--encre); }
.evenement-carte { border: 1px solid var(--commerce); border-left: 4px solid var(--commerce); background: var(--papier); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.evenement-carte .theme { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--commerce); font-weight: 700; }
.evenement-carte h3 { margin: 0; font-family: var(--f-titre); font-weight: 400; font-size: 19px; color: var(--encre); text-transform: none; letter-spacing: 0; }
.evenement-carte .choix { display: flex; flex-direction: column; gap: 5px; }
.evenement-carte .choix button { text-align: left; font-weight: 500; background: var(--panneau); }
.temoins { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--encre-douce); }
.temoins b { color: var(--encre); font-weight: 600; }
.journal .evt b { color: var(--commerce); }
/* Lieu bondé : on n'affiche l'étiquette qu'au survol ou pour l'élément choisi. */
.ent.serre text { opacity: 0; transition: opacity .2s; }
.ent.serre:hover text, .ent.serre:focus text, .ent.serre.choisi text, .ent.serre.joueur text { opacity: 1; }
.ent.serre:hover, .ent.serre:focus { outline: none; }
</style>

<div class="appli">
  <header class="bandeau">
    <h1>Valentine<small>New Hanover, 1899</small></h1>
    <dl class="stats" aria-live="polite">
      <div class="stat"><dt>Honneur</dt><dd id="s-honneur">0</dd></div>
      <div class="stat"><dt>Argent</dt><dd id="s-argent">25 $</dd></div>
      <div class="stat"><dt>Prime</dt><dd id="s-prime">0 $</dd></div>
      <div class="stat"><dt>Santé</dt><dd id="s-sante">100</dd></div>
      <div class="stat"><dt>Jour</dt><dd id="s-jour">lundi</dd></div>
      <div class="stat"><dt>Ciel</dt><dd id="s-meteo">beau</dd></div>
    </dl>
    <div class="horloge">
      <button id="toi" type="button" class="plein">Toi</button>
      <label for="heure">Heure</label>
      <input type="range" id="heure" min="0" max="23" step="1" value="9">
      <output id="heure-txt" for="heure">9 h 00</output>
      <button id="attendre" type="button">+1 h</button>
      <button id="lecture" type="button" aria-pressed="false">Lecture</button>
      <button id="recommencer" type="button">Recommencer</button>
    </div>
  </header>
  <main class="corps">
    <div class="carte-cadre">
      <svg id="carte" role="img" aria-label="Plan de Valentine vu de haut"></svg>
      <div class="legende-carte" aria-hidden="true">
        <span style="color:var(--accent)"><i style="background:var(--accent)"></i>Toi</span>
        <span style="color:var(--encre)"><i></i>Habitant</span>
        <span style="color:var(--loi)"><i></i>Loi</span>
        <span style="color:var(--horsla)"><i></i>Hors-la-loi</span>
        <span style="color:var(--commerce)"><i></i>Commerçant</span>
        <span style="color:var(--animal)"><i></i>Animal</span>
        <span style="color:var(--objet)"><i style="border-radius:1px"></i>Objet</span>
      </div>
      <div class="zoom">
        <button id="zoom-plus" type="button" aria-label="Zoomer">+</button>
        <button id="zoom-moins" type="button" aria-label="Dézoomer">−</button>
        <button id="zoom-zero" type="button" aria-label="Voir toute la ville">⤢</button>
      </div>
    </div>
    <aside class="registre" id="registre"></aside>
  </main>
</div>

<script>
const D = __DONNEES__;
const SVGNS = "http://www.w3.org/2000/svg";
const CLE_STOCKAGE = "valentine-1899-partie-v2";
const JOUEUR = "_joueur";
const ORDRE_CATEGORIES = ["joueur", "habitant", "animal", "objet"];
const NOM_CATEGORIE = { habitant: "Habitant", animal: "Animal", objet: "Objet", batiment: "Bâtiment" };
const NOM_ETAT = { normal: "", mort: "Mort", blesse: "Blessé", hostile: "Hostile", en_fuite: "En fuite", ligote: "Ligoté", detruit: "Détruit" };
const NOM_METEO = { beau: "beau temps", chaleur: "canicule", pluie: "pluie", orage: "orage", brouillard: "brouillard" };
const INDISPONIBLE = ["mort", "en_fuite", "ligote", "detruit"];
const VIVANTS = ["habitant", "animal"];

// ---------- État de la partie ----------
function nouvellePartie() {
  return {
    heure: 9, jour: 0, meteo: "beau", lieu: "rue_principale", aCheval: false, monture: null,
    honneur: 0, argent: 25, prime: 0, sante: 100,
    entites: {}, drapeaux: [], vus: [], derniers: {}, journal: [], enCours: null,
  };
}
function chargerPartie() {
  try { const t = localStorage.getItem(CLE_STOCKAGE); return t ? Object.assign(nouvellePartie(), JSON.parse(t)) : null; }
  catch (e) { return null; }
}
function sauver() {
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ }
}
let S = chargerPartie() || nouvellePartie();
let selection = null;
let derniereReponse = null;

const heureTotale = () => S.jour * 24 + S.heure;
const nomJour = () => D.jours[S.jour % 7];
function etatDe(id) { return (S.entites[id] && S.entites[id].etat) || "normal"; }
function relationDe(id) { return (S.entites[id] && S.entites[id].relation) || 0; }
function memoire(id) { return S.entites[id] || (S.entites[id] = { etat: "normal", relation: 0 }); }
const disponible = id => !INDISPONIBLE.includes(etatDe(id));

// ---------- Texte ----------
function accorder(t) {
  return t
    .replace(/(^|[\s«(])à le(?=\s)/g, "$1au")
    .replace(/(^|[\s«(])à les(?=\s)/g, "$1aux")
    .replace(/(^|[\s«(])de le(?=\s)/g, "$1du")
    .replace(/(^|[\s«(])de les(?=\s)/g, "$1des")
    .replace(/(^|[\s«(])de (?=[aeiouyéèêàâîôû])/g, "$1d'");
}
function majuscule(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
function nomDe(id) { return id ? (D.noms[id] || id) : ""; }
function etiquette(e) {
  if (e.etiquette) return e.etiquette;
  if (e.metier) return e.metier;
  return majuscule(e.nom.replace(/^(le |la |les |l'|un |une |ton |des |du )/, ""));
}
function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function h(tag, props, ...enfants) {
  const n = document.createElement(tag);
  for (const k in props || {}) {
    if (k === "class") n.className = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else if (props[k] !== undefined && props[k] !== null && props[k] !== false) n.setAttribute(k, props[k]);
  }

// ---------- Temps, lieux, monde ----------
const estNuit = () => S.heure >= 21 || S.heure < 6;

}
function lieuActuel(e) {
  if (e.id === JOUEUR) return S.lieu;

  if (m && m.lieuFige) return m.lieuFige;

}
function conditionMonde(c) {
  if (c.includes(":")) {
    const [p, id] = c.split(":");
    switch (p) {
      case "present": return S.lieu === id;
      case "mort": return etatDe(id) === "mort";
      case "vivant": return etatDe(id) !== "mort";
      case "ami": return relationDe(id) >= 3;
      case "hostile": return etatDe(id) === "hostile" || relationDe(id) <= -3;
      default: return false;
    }
  }
  switch (c) {
    case "honneur_haut": return S.honneur >= 3;
    case "honneur_bas": return S.honneur <= -3;
    case "est_recherche": return S.prime > 0;
    case "nuit": return estNuit();
    case "jour": return !estNuit();
    case "dedans": return D.lieux[S.lieu] && D.lieux[S.lieu].type === "batiment";
    case "dehors": return !(D.lieux[S.lieu] && D.lieux[S.lieu].type === "batiment");
    case "a_cheval": return S.aCheval;
    case "pluie": return S.meteo === "pluie" || S.meteo === "orage";
    case "orage": return S.meteo === "orage";
    case "brouillard": return S.meteo === "brouillard";

}
function conditionVraie(c, id) {

  if (c === "ami") return relationDe(id) >= 3;
  return conditionMonde(c);
}
function changerMeteo() {
  if (S.meteo === "brouillard" && S.heure >= 10) { S.meteo = "beau"; return; }
  if (Math.random() > .12) return;
  const poids = { beau: 6, chaleur: S.heure >= 11 && S.heure < 18 ? 2 : 0, pluie: 2, orage: 1, brouillard: S.heure >= 4 && S.heure < 9 ? 2 : 0 };
  let total = 0; for (const k in poids) total += poids[k];

// ---------- Événements ----------
function evenementPossible(ev) {
  if (ev.unique && S.vus.includes(ev.id)) return false;
  if (!ev.unique && S.derniers[ev.id] !== undefined && heureTotale() - S.derniers[ev.id] < 12) return false;
  if (ev.heures && !heureDans(S.heure, ev.heures)) return false;
  if (ev.jours && ev.jours.length && !ev.jours.includes(nomJour())) return false;
  if (ev.meteo && ev.meteo.length && !ev.meteo.includes(S.meteo)) return false;
  if (!(ev.si || []).every(conditionMonde)) return false;
  if (!(ev.drapeaux || []).every(d => d.startsWith("!") ? !S.drapeaux.includes(d.slice(1)) : S.drapeaux.includes(d))) return false;
  return (ev.acteurs || []).every(disponible);
}
function appliquerConsequences(cons) {
  if (!cons) return;
  for (const d of cons.drapeaux || []) {
    const nom = d.slice(1);
    if (d[0] === "+" && !S.drapeaux.includes(nom)) S.drapeaux.push(nom);
    if (d[0] === "-") S.drapeaux = S.drapeaux.filter(x => x !== nom);
  }
  for (const [id, ch] of Object.entries(cons.entites || {})) {
    const m = memoire(id);
    if (ch.relation) m.relation = borne(m.relation + ch.relation, -5, 5);
    if (ch.lieu !== undefined) { if (ch.lieu) m.lieuFige = ch.lieu; else delete m.lieuFige; }

}
function declencher(ev) {

  appliquerConsequences(ev.consequences);
  S.journal.unshift({ type: "evt", h: S.heure, titre: ev.titre, texte: ev.texte });

}
function tourDesEvenements() {
  let n = 0;
  for (const ev of melanger(Object.values(D.evenements))) {
    if (n >= 2) break;
    if (ev.apres || !evenementPossible(ev)) continue;
    if (ev.choix && S.enCours) continue;
    if (Math.random() < ev.chance) { declencher(ev); n++; }
  }
}
function reactionEnChaine(verbe, cible) {
  for (const ev of melanger(Object.values(D.evenements))) {

    if (ev.apres.cibles && ev.apres.cibles.length && !ev.apres.cibles.includes(cible)) continue;
    if (!evenementPossible(ev)) continue;

}
function choisirIssue(ev, c) {
  if (c.effets) appliquerJoueur(c.effets);

  S.enCours = null;
  S.journal.unshift({ type: "evt", h: S.heure, titre: c.texte, texte: c.resultat });
  derniereReponse = { id: "_evenement", action: `${ev.titre} — ${c.texte}`, texte: c.resultat, effets: c.effets || {}, temoins: [] };

}
function avancer(heures) {

// ---------- Positions ----------
function positions() {
  const parLieu = {};
  const tous = [{ id: JOUEUR, categorie: "joueur", lieu: S.lieu }, ...Object.values(D.entites)];
  for (const e of tous) {
    if (e.categorie === "batiment") continue;
    (parLieu[lieuActuel(e)] ||= []).push(e);
  }
  const pos = {};
  for (let [lid, liste] of Object.entries(parLieu)) {
    const l = D.lieux[lid];
    if (!l) continue;
    for (const e of liste.filter(e => e.pos && lieuActuel(e) === e.lieu)) pos[e.id] = { x: e.pos[0], y: e.pos[1] };
    liste = liste.filter(e => !pos[e.id]);
    if (!liste.length) continue;
    const [x, y, w, hh] = l.rect;
    const haut = l.type === "batiment" ? 30 : 10;
    const z = { x: x + 8, y: y + haut, w: w - 16, h: hh - haut - 8 };
    liste.sort((a, b) => ORDRE_CATEGORIES.indexOf(a.categorie) - ORDRE_CATEGORIES.indexOf(b.categorie) || a.id.localeCompare(b.id));
    const n = liste.length;
    let cols = Math.max(1, Math.min(n, Math.round(Math.sqrt(n * z.w / Math.max(z.h, 1)))));
    while (cols > 1 && z.w / cols < 78 && z.h / Math.ceil(n / (cols - 1)) >= 44) cols--;
    while (cols < n && z.h / Math.ceil(n / cols) < 44 && z.w / (cols + 1) >= 50) cols++;
    const lignes = Math.ceil(n / cols);
    const serre = z.w / cols < 62 || z.h / lignes < 40;
    liste.forEach((e, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      pos[e.id] = { x: z.x + z.w * (c + .5) / cols, y: z.y + z.h * (r + .5) / lignes, serre };
    });
  }

}

// ---------- Règles ----------
function conditionsVerbeOk(conditions) {
  const drapeaux = { a_de_l_argent: S.argent > 0, est_recherche: S.prime > 0, a_cheval: S.aCheval };
  for (const c of conditions) {
    const neg = c.startsWith("!"), nom = c.replace("!", "");
    if (Boolean(drapeaux[nom]) === neg) {
      const raisons = { a_de_l_argent: "sans argent", est_recherche: "si recherché", a_cheval: neg ? "descends de cheval" : "à cheval" };
      return { ok: false, raison: raisons[nom] || nom };
    }
  }
  return { ok: true };
}
function choisirVariante(variantes, id) {
  const test = id === JOUEUR ? conditionMonde : c => conditionVraie(c, id);
  const possibles = variantes.filter(v => (v.si || []).every(test));
  const liste = possibles.length ? possibles : variantes.filter(v => !(v.si || []).length);
  let total = 0;
  const poids = liste.map(v => (total += 1 + 2 * (v.si || []).length));
  const r = Math.random() * total;
  return liste[poids.findIndex(p => r < p)];
}
const borne = (v, a, b) => Math.max(a, Math.min(b, v));

function changerEtat(id, etat) {
  const m = memoire(id);
  const e = D.entites[id];
  m.etat = etat;
  if (["mort", "ligote"].includes(etat) && e && e.categorie !== "batiment") m.lieuFige = lieuActuel(e);
  if (etat === "normal") delete m.lieuFige;
  if (etat === "mort" && S.monture === id) { S.aCheval = false; S.monture = null; }
}
function appliquerJoueur(effets) {
  const primeAvant = S.prime;
  if (effets.honneur) S.honneur = borne(S.honneur + effets.honneur, -10, 10);
  if (effets.argent) S.argent = Math.max(0, S.argent + effets.argent);
  if (effets.prime) S.prime = Math.max(0, S.prime + effets.prime);
  if (effets.sante) S.sante = borne(S.sante + effets.sante, 0, 100);
  // Au-delà de 50 $ de prime, la loi te considère comme un ennemi.
  if (primeAvant < 50 && S.prime >= 50) {
    for (const e of Object.values(D.entites)) if (e.faction === "loi") memoire(e.id).relation = Math.min(relationDe(e.id), -3);
  }
}
function appliquerEffets(id, effets) {
  appliquerJoueur(effets);
  if (id === JOUEUR) return;
  const m = memoire(id);
  if (effets.relation) m.relation = borne(m.relation + effets.relation, -5, 5);
  if (effets.etat) changerEtat(id, effets.etat);
}

function categorieTemoin(action, effets, cible) {
  const v = action.cle.replace("@outil", "");
  if (effets.etat === "mort" && cible && VIVANTS.includes(cible.categorie)) return "meurtre";
  if (/vol|detrouss|braqu|crochet|chapard|cambriol|fouiller|rafler|piller|subtilis/.test(v)) return "vol";
  if (action.categorie === "Combat" || ["blesse", "hostile", "ligote"].includes(effets.etat) || (effets.sante || 0) < 0) return "violence";
  if ((effets.prime || 0) > 0) return "crime";
  if ((effets.honneur || 0) > 0) return "bonte";
  return Math.random() < .3 ? "insolite" : null;
}
function reactionsTemoins(id, action, effets) {
  const cible = D.entites[id];
  const categorie = categorieTemoin(action, effets, cible);
  if (!categorie) return [];
  const lieu = id === JOUEUR ? S.lieu : lieuActuel(cible);
  const presents = Object.values(D.entites).filter(e => e.id !== id && VIVANTS.includes(e.categorie)
    && D.temoins[e.id] && disponible(e.id) && lieuActuel(e) === lieu);
  return melanger(presents).slice(0, 2).map(e => {
    const texte = hasard(D.temoins[e.id][categorie]);
    setTimeout(() => bulle(e.id, texte), 400);
    return { nom: majuscule(e.nom), texte };
  });
}

function reglesSpeciales(cle, option) {
  const v = cle.replace("@outil", "");
  if (v === "monter_a_cheval" && option.cible) { S.aCheval = true; S.monture = option.cible; }
  if (v === "descendre_de_cheval") { S.aCheval = false; S.monture = null; }
  if (v === "entrer" && option.cible && D.lieux[option.cible]) S.lieu = option.cible;
  if (v === "payer_prime") { const paye = Math.min(S.argent, S.prime); S.argent -= paye; S.prime -= paye; }
  if (v === "se_rendre") { S.prime = 0; S.lieu = "bureau_sherif"; }
  if (/^dormir|sieste/.test(v)) avancer(/sieste/.test(v) ? 2 : 8);
}

function agir(id, action, option) {
  const e = id === JOUEUR ? null : D.entites[id];
  const cle = action.cle;
  let variante;
  const etat = etatDe(id);
  if (e && e.categorie !== "batiment") S.lieu = lieuActuel(e);
  if (e && e.categorie === "batiment") S.lieu = id;
  if (cle === "_fouiller_corps") {
    const butin = 1 + Math.floor(Math.random() * 12);
    variante = { texte: `Tu retournes les poches de ${e.nom}. Tu trouves ${butin} $ et une photo jaunie.`, effets: { argent: butin, honneur: -1 } };
  } else if (cle === "_detacher") {
    variante = { texte: `Tu tranches les liens. ${majuscule(e.nom)} se frotte les poignets et te regarde sans comprendre.`, effets: { etat: "normal", relation: 1 } };
  } else if (etat === "mort" || etat === "detruit") {
    variante = { texte: etat === "mort" ? `${majuscule(e.nom)} ne bouge plus. Les mouches arrivent déjà.` : `Il ne reste que des débris de ${e.nom}.` };
  } else {
    const variantes = (id === JOUEUR ? D.joueur.reactions : e.reactions)[cle];
    variante = variantes && variantes.length ? choisirVariante(variantes, id) : { texte: `${majuscule(option.texte)} : rien de particulier ne se passe.` };
  }
  let texte = variante.texte.replaceAll("{cible}", nomDe(option.cible)).replaceAll("{outil}", nomDe(option.outil));
  texte = majuscule(accorder(texte));
  const effets = { ...(variante.effets || {}) };
  // Payer sa prime règle toute la dette d'un coup : le moteur fait le calcul.
  if (cle === "payer_prime") { delete effets.prime; delete effets.argent; }
  appliquerEffets(id, effets);
  reglesSpeciales(cle, option);
  const temoins = reactionsTemoins(id, action, effets);
  derniereReponse = { id, action: majuscule(option.texte), texte, effets, temoins };
  S.journal.unshift({ type: "action", h: S.heure, titre: majuscule(option.texte), texte });
  reactionEnChaine(cle.replace("@outil", ""), id);
  apresAction();
}
function apresAction() {
  if (S.sante <= 0) {
    const t = "Tu t'effondres dans la boue. Tu te réveilles chez le docteur, qui t'a soulagé de 10 $.";
    S.sante = 40; S.argent = Math.max(0, S.argent - 10); S.lieu = "cabinet_medecin"; S.aCheval = false; S.monture = null;
    if (derniereReponse) derniereReponse.suite = t;
    S.journal.unshift({ type: "action", h: S.heure, titre: "Évanoui", texte: t });
  }
  S.journal.length = Math.min(S.journal.length, 60);
  sauver();
  rafraichir();
}

// ---------- Registre ----------
const registre = document.getElementById("registre");
function libelleRelation(r) {
  if (r <= -3) return ["Hostile", "rel-neg"];
  if (r < 0) return ["Méfiant", "rel-neg"];
  if (r >= 3) return ["Ami", "rel-pos"];
  if (r > 0) return ["Amical", "rel-pos"];
  return ["Neutre", ""];
}
function puceEffets(effets) {
  const sortie = [];
  const fmt = { honneur: v => `${v > 0 ? "+" : ""}${v} honneur`, argent: v => `${v > 0 ? "+" : "−"}${Math.abs(v)} $`,
    prime: v => `prime ${v > 0 ? "+" : "−"}${Math.abs(v)} $`, sante: v => `santé ${v > 0 ? "+" : ""}${v}`, relation: v => `relation ${v > 0 ? "+" : ""}${v}` };
  for (const [k, v] of Object.entries(effets || {})) {
    if (k === "etat") { sortie.push(h("span", { class: "effet moins" }, "→ " + (NOM_ETAT[v] || "rétabli"))); continue; }
    if (!fmt[k] || !v) continue;
    const bon = k === "prime" ? v < 0 : v > 0;
    sortie.push(h("span", { class: "effet " + (bon ? "plus" : "moins") }, fmt[k](v)));
  }
  return sortie.length ? h("div", { class: "effets" }, sortie) : null;
}
function blocReponse(pour) {
  if (!derniereReponse || derniereReponse.id !== pour) return null;
  const r = derniereReponse;
  return h("div", { class: "reponse", role: "status" },
    h("span", { class: "quoi" }, r.action),
    h("p", { class: "texte" }, r.texte),
    r.suite ? h("p", { class: "texte" }, r.suite) : null,
    puceEffets(r.effets),
    r.temoins && r.temoins.length ? h("div", { class: "temoins" }, r.temoins.map(t => h("span", {}, h("b", {}, t.nom), " ", t.texte))) : null);
}
function blocEvenement() {
  if (!S.enCours || !D.evenements[S.enCours]) return blocReponse("_evenement");
  const ev = D.evenements[S.enCours];
  const choix = ev.choix.filter(c => (c.si || []).every(conditionMonde));
  return h("section", { class: "evenement-carte", "aria-live": "polite" },
    h("span", { class: "theme" }, `${ev.theme} · ${D.lieux[ev.lieu] ? D.lieux[ev.lieu].nom : ""}`),
    h("h3", {}, ev.titre),
    h("p", {}, ev.texte),
    h("div", { class: "choix" },
      choix.map(c => {
        const cout = c.effets && c.effets.argent < 0 ? -c.effets.argent : 0;
        return h("button", { type: "button", disabled: cout > S.argent, onclick: () => choisirIssue(ev, c) }, c.texte + (cout ? ` (${cout} $)` : ""));
      }),
      h("button", { type: "button", onclick: () => { S.enCours = null; sauver(); rafraichir(); } }, "Laisser faire")));
}
function actionsDisponibles(e) {
  const etat = etatDe(e.id);
  if (etat === "mort" || etat === "detruit") {
    const permis = new Set(["observer", "photographier", "dessiner", "porter", "tirer", "lancer"]);
    const garde = e.actions.filter(a => permis.has(a.cle));
    if (etat === "mort") garde.unshift({ cle: "_fouiller_corps", categorie: "Économie & crime", conditions: [], options: [{ texte: `fouiller le corps de ${e.nom}` }] });
    return garde;
  }
  if (etat === "ligote") return [{ cle: "_detacher", categorie: "Combat", conditions: [], options: [{ texte: `détacher ${e.nom}` }] }, ...e.actions];
  return e.actions;
}
function ligneAction(id, a) {
  const verif = conditionsVerbeOk(a.conditions);
  const opts = a.options.map(o => ({ ...o, texte: accorder(o.texte) }));
  const raison = verif.ok ? null : h("span", { class: "raison" }, verif.raison);
  if (opts.length === 1) {
    return h("li", { class: "action-ligne" },
      h("button", { class: "action", type: "button", disabled: !verif.ok, onclick: () => agir(id, a, opts[0]) }, majuscule(opts[0].texte)), raison);
  }
  const sid = `opt-${id}-${a.cle}`.replace(/[^\w-]/g, "_");
  const sel = h("select", { id: sid, "aria-label": "Variante de l'action" }, opts.map((o, i) => h("option", { value: i }, majuscule(o.texte))));
  return h("li", { class: "action-ligne" }, sel,
    h("button", { class: "faire plein", type: "button", disabled: !verif.ok, onclick: () => agir(id, a, opts[+sel.value]) }, "Faire"), raison);
}
function blocsActions(id, actions) {
  const parCategorie = {};
  for (const a of actions) (parCategorie[a.categorie] ||= []).push(a);
  return Object.entries(parCategorie).map(([cat, liste], i) =>
    h("details", { class: "categorie-actions", open: i < 2 ? "" : null },
      h("summary", {}, `${cat} (${liste.length})`),
      h("ul", {}, liste.map(a => ligneAction(id, a)))));
}
function retour() { return h("button", { class: "retour", type: "button", onclick: () => choisir(null) }, "← Toute la ville"); }
function ficheEntite(e) {
  const etat = etatDe(e.id);
  const [rel, relClasse] = libelleRelation(relationDe(e.id));
  const c = creneau(e);
  const lid = e.categorie === "batiment" ? e.id : lieuActuel(e);
  const actions = actionsDisponibles(e);
  return h("div", { class: "fiche" },
    retour(),
    h("div", { class: "pastilles" },
      h("span", { class: "pastille" }, e.metier || NOM_CATEGORIE[e.categorie]),
      etat !== "normal" ? h("span", { class: "pastille etat-" + etat }, NOM_ETAT[etat]) : null,
      VIVANTS.includes(e.categorie) ? h("span", { class: "pastille " + relClasse }, rel) : null,
      lid === S.lieu ? h("span", { class: "pastille rel-pos" }, "Tu es ici") : null),
    h("h2", {}, majuscule(e.nom)),
    h("p", { class: "ou" }, D.lieux[lid] ? D.lieux[lid].nom : "", c && etat === "normal" ? ` · ${c.activite}` : ""),
    blocReponse(e.id),
    e.description ? h("p", { class: "desc" }, e.description) : null,
    e.personnalite ? h("p", { class: "perso" }, e.personnalite) : null,
    h("div", {}, h("h3", {}, `Que veux-tu faire ? (${actions.length} actions)`), blocsActions(e.id, actions)));
}
function ficheJoueur() {
  return h("div", { class: "fiche" },
    retour(),
    h("div", { class: "pastilles" },
      h("span", { class: "pastille" }, S.aCheval ? `À cheval (${nomDe(S.monture)})` : "À pied"),
      S.prime > 0 ? h("span", { class: "pastille etat-hostile" }, `Recherché · ${S.prime} $`) : null),
    h("h2", {}, "Toi"),
    h("p", { class: "ou" }, `${D.lieux[S.lieu] ? D.lieux[S.lieu].nom : ""} · ${nomJour()} ${S.heure} h · ${NOM_METEO[S.meteo]}`),
    blocReponse(JOUEUR),
    h("p", { class: "desc" }, D.joueur.description),
    h("div", {}, h("h3", {}, `Seul ou avec ton inventaire (${D.joueur.actions.length} actions)`), blocsActions(JOUEUR, D.joueur.actions)));
}
function ficheVille() {
  const groupes = { habitant: [], animal: [], objet: [], batiment: [] };
  for (const e of Object.values(D.entites)) groupes[e.categorie].push(e);
  const titres = { habitant: "Habitants", animal: "Animaux", objet: "Objets", batiment: "Bâtiments" };
  return h("div", { class: "fiche index-ville" },
    h("h2", {}, "Valentine, ville d'éleveurs"),
    h("p", { class: "desc" }, "Rue de boue, odeur de bétail, deux saloons et un shérif fatigué. Les O'Driscoll préparent quelque chose avant le train du juge, jeudi. Clique sur un rond, un losange ou un bâtiment, ou fais avancer l'heure pour voir la ville vivre."),
    h("p", { class: "monde" }, "Tu es : ", h("b", {}, D.lieux[S.lieu] ? D.lieux[S.lieu].nom : ""), ` · ${nomJour()} ${S.heure} h · ${NOM_METEO[S.meteo]}`),
    h("div", { class: "chiffres" },
      h("div", {}, h("b", {}, D.stats.actions.toLocaleString("fr-FR")), h("span", {}, "actions")),
      h("div", {}, h("b", {}, D.stats.variantes.toLocaleString("fr-FR")), h("span", {}, "réactions")),
      h("div", {}, h("b", {}, D.stats.evenements.toLocaleString("fr-FR")), h("span", {}, "événements"))),
    ...Object.entries(groupes).map(([cat, liste]) => h("div", {},
      h("h3", {}, `${titres[cat]} (${liste.length})`),
      h("ul", {}, liste.map(e => h("li", {}, h("button", { type: "button", onclick: () => choisir(e.id) }, cat === "habitant" ? e.metier : majuscule(e.nom))))))));
}
function blocJournal() {
  if (!S.journal.length) return null;
  return h("div", {}, h("h3", {}, "Journal de la ville"),
    h("ol", { class: "journal" }, S.journal.map(j => h("li", { class: j.type }, h("span", { class: "h" }, `${j.h} h`), h("b", {}, j.titre), ". ", j.texte))));
}
function rafraichirRegistre() {
  const e = selection && selection !== JOUEUR ? D.entites[selection] : null;
  const fiche = selection === JOUEUR ? ficheJoueur() : e ? ficheEntite(e) : ficheVille();
  registre.replaceChildren(...[blocEvenement(), fiche, blocJournal()].filter(Boolean));
}
function rafraichirStats() {
  const ecrire = (id, txt, classe) => { const n = document.getElementById(id); n.textContent = txt; n.className = classe || ""; };
  ecrire("s-honneur", (S.honneur > 0 ? "+" : "") + S.honneur, S.honneur <= -3 ? "mauvais" : S.honneur >= 3 ? "bon" : "");
  ecrire("s-argent", `${S.argent} $`);
  ecrire("s-prime", `${S.prime} $`, S.prime > 0 ? "mauvais" : "");
  ecrire("s-sante", S.sante, S.sante < 40 ? "mauvais" : "");
  ecrire("s-jour", nomJour());
  ecrire("s-meteo", NOM_METEO[S.meteo]);
  document.getElementById("heure").value = S.heure;
  document.getElementById("heure-txt").textContent = `${S.heure} h 00`;
}
function rafraichir() { rafraichirStats(); majCarte(); rafraichirRegistre(); }
function choisir(id) {
  selection = id;
  rafraichir();
  registre.scrollTop = 0;
}

// ---------- Interactions ----------
dessinerFond();
dessinerEntites();
appliquerVue();

let glisse = null, aGlisse = false;
svg.addEventListener("pointerdown", ev => { glisse = { x: ev.clientX, y: ev.clientY, vue: { ...vue } }; aGlisse = false; });
svg.addEventListener("pointermove", ev => {
  if (!glisse) return;
  const dx = ev.clientX - glisse.x, dy = ev.clientY - glisse.y;
  if (!aGlisse && Math.hypot(dx, dy) < 5) return;
  if (!aGlisse) { aGlisse = true; svg.setPointerCapture(ev.pointerId); svg.classList.add("glisse"); }
  const echelle = vue.w / svg.clientWidth;
  vue.x = glisse.vue.x - dx * echelle; vue.y = glisse.vue.y - dy * echelle;
  appliquerVue();
});
const finGlisse = () => { glisse = null; svg.classList.remove("glisse"); };
svg.addEventListener("pointerup", finGlisse);
svg.addEventListener("pointercancel", finGlisse);
svg.addEventListener("click", ev => {
  if (aGlisse) { aGlisse = false; return; }
  const cible = ev.target.closest("[data-id]");
  if (cible) choisir(cible.dataset.id);
});
svg.addEventListener("keydown", ev => {
  const cible = ev.target.closest("[data-id]");
  if (cible && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); choisir(cible.dataset.id); }
});
svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = pointCarte(ev); zoomer(ev.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, { passive: false });
document.getElementById("zoom-plus").onclick = () => zoomer(1 / 1.3);
document.getElementById("zoom-moins").onclick = () => zoomer(1.3);
document.getElementById("zoom-zero").onclick = () => { vue = { x: 0, y: 0, w: LARGEUR, h: HAUTEUR }; appliquerVue(); };
document.getElementById("toi").onclick = () => choisir(JOUEUR);

function passerHeures(n) {
  const meteoAvant = S.meteo;
  avancer(n);
  if (S.meteo === "orage" || (S.meteo !== meteoAvant && S.meteo === "orage")) { eclair.classList.remove("flash"); void eclair.getBBox(); eclair.classList.add("flash"); }
  sauver();
  rafraichir();
}
document.getElementById("heure").addEventListener("change", ev => passerHeures((+ev.target.value - S.heure + 24) % 24));
document.getElementById("heure").addEventListener("input", ev => { document.getElementById("heure-txt").textContent = `→ ${ev.target.value} h`; });
document.getElementById("attendre").onclick = () => passerHeures(1);
let minuterie = null;
document.getElementById("lecture").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (minuterie) { clearInterval(minuterie); minuterie = null; b.textContent = "Lecture"; b.setAttribute("aria-pressed", "false"); return; }
  minuterie = setInterval(() => passerHeures(1), 2200);
  b.textContent = "Pause"; b.setAttribute("aria-pressed", "true");
});
let confirmation = false;
document.getElementById("recommencer").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (!confirmation) { confirmation = true; b.textContent = "Confirmer ?"; setTimeout(() => { confirmation = false; b.textContent = "Recommencer"; }, 3000); return; }
  confirmation = false; b.textContent = "Recommencer";
  S = nouvellePartie(); derniereReponse = null; sauver(); choisir(null);
});

function ajusterNomsBatiments() {
  for (const t of svg.querySelectorAll(".batiment text")) {
    t.removeAttribute("textLength");
    if (t.getComputedTextLength() > +t.dataset.largeur) {
      t.setAttribute("textLength", t.dataset.largeur);
      t.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
  }
}
ajusterNomsBatiments();
if (document.fonts) document.fonts.ready.then(ajusterNomsBatiments);
rafraichir();
setInterval(bulleAuHasard, 2400);
setTimeout(bulleAuHasard, 600);
</script>
